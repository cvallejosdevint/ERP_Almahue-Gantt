# Site nginx — Almahue ERP (stack /opt/almahue_erp)
# Dominio propuesto: almahue-erp.vndev.cl
# Requiere DNS A → 45.7.229.46 antes de emitir certificado Let's Encrypt.
#
# Instalación (root/sudo):
#   cp deploy/nginx-almahue-erp.vndev.cl.conf /etc/nginx/sites-available/almahue-erp.vndev.cl
#   ln -sf /etc/nginx/sites-available/almahue-erp.vndev.cl /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d almahue-erp.vndev.cl

server {
    listen 80;
    listen [::]:80;
    server_name almahue-erp.vndev.cl;

    # Permite payloads JSON con logos/sellos en base64 (Empresa.plantillaDoc).
    client_max_body_size 15m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Tras certbot, este bloque suele redirigir a HTTPS.
    # Mientras tanto: proxy al contenedor web (nginx interno proxya /api → api).
    location / {
        proxy_pass http://127.0.0.1:4011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
