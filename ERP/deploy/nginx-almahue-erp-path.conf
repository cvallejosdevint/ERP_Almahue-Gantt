# Fragmento para el default_server por IP.
# Expone el ERP en http://45.7.229.46/almahue-erp/ sin DNS.
# No reemplaza el site Freshlink en `/` — solo agrega locations.
#
# IMPORTANTE en este host: `/etc/nginx/sites-enabled/almahue-ip` es una COPIA
# (no symlink). Editar/reemplazar ese archivo (y sincronizar sites-available).
#
# Instalación:
#   Incluir estas locations DENTRO del server { ... } de almahue-ip
#   (antes de `location /`). Luego: sudo nginx -t && sudo systemctl reload nginx
#   (si reload no aplica, `sudo systemctl restart nginx`)
#
# Proxy:
#   /almahue-erp/     → web 127.0.0.1:4011/  (strip del prefijo)
#   /almahue-erp/api/ → api 127.0.0.1:4010/api/
# El front se buildéa con VITE_BASE_PATH=/almahue-erp/ (assets bajo ese path).

    location = /almahue-erp {
        return 301 /almahue-erp/;
    }

    location /almahue-erp/api/ {
        # Permite payloads JSON con logos/sellos en base64 (Empresa.plantillaDoc).
        client_max_body_size 15m;
        proxy_pass http://127.0.0.1:4010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /almahue-erp;
    }

    location /almahue-erp/ {
        proxy_pass http://127.0.0.1:4011/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /almahue-erp;
        proxy_cache_bypass $http_upgrade;
    }
