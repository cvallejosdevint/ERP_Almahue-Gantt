    const steps = [{"mod": "PARAM", "cls": "param", "title": "1. 1. Contratistas: reversa, periodo y traspaso (AM) `[00:35 - 03:46]`", "body": "* **Sin reapertura desde Traspaso y cierre:** Quitar boton de reapertura en traspaso/cierre contable de contratistas. Cualquier correccion de proforma se inicia con **solicitud de reversa desde la proforma**, no reabriendo el panel de cierre. `[00:50]`, `[01:12]`<br>* **Periodo abierto vs cerrado:** En periodo **abierto**, al solicitar reversa debe abrirse el **wizard** (motivo + PIN) y quedar visible el flujo de **dos vistos buenos** (jefatura contratistas + contabilidad). **Bug acordado:** hoy no levanta el wizard y en periodo cerrado aparece mensaje incorrecto; en periodo cerrado aun se ve habilitada la reversa cuando no deberia. `[01:45]`, `[02:13]`, `[03:24]`<br>* **Filtro de proformas por periodo:** No mostrar proformas de periodos anteriores en la grilla del periodo actual. `[30:02]`, `[30:45]`<br>* **Indicador factura vinculada:** Mostrar recuadro de factura asociada **solo** si existe vinculo real; si no hay factura, no mostrar el bloque. `[30:55]`<br>* **Demo sin modo demo:** Continuar pruebas con **facturacion real entre empresas** (no modo demo) para centralizar, reversa y trazabilidad end-to-end. `[02:38]`, `[02:44]`<br>---", "quote": "Y en sí, como no hablamos de la reapertura, la idea es que sea directamente cuando se haga alguna modificación en las proformas."}, {"mod": "PARAM", "cls": "param", "title": "2. 2. AlmaWeb / Temite (AM, coordinacion Jose) `[35:23 - 41:51]`", "body": "* **Prioridad externa:** Compromisos de fechas en Temite/AlmaWeb retrasados; se pide apoyo de Devint sin bloquear entrega ERP acordada. `[35:23]`, `[35:34]`<br>* **Pendientes AlmaWeb (MJ):** (1) tema de **numeros** en portal; (2) permisos **usuarios administradores** vs carga de evidencias desde portal (Paola). Corregir en AlmaWeb. `[36:49]`, `[40:15]`, `[40:30]`<br>* **Compromiso operativo:** Mario arma **documento consolidado de pendientes** AlmaWeb; Devint indica que puntos ya resueltos no se dupliquen en el archivo. `[40:39]`, `[40:51]`, `[41:14]`<br>---", "quote": "Sí, pero es que por el lado de Temite también está lo que te dije, pues yo me comprometí con fechas, y eso es tan atrasado. Por eso no quería pasarle nada al Diego."}, {"mod": "PARAM", "cls": "param", "title": "3. 3. Admin, roles y aprobaciones (PM) `[02:23 - 08:16]`", "body": "* **Usuarios en reglas de aprobacion:** Al crear grupo/regla de aprobacion (ej. OC), debe listarse claramente **quienes ya tienen el rol**; hoy la UI queda restrictiva y confusa. `[02:23]`, `[05:22]`<br>* **Mejora UX:** Preferencia de ver **todos los usuarios** con el **grupo/rol actual** al armar la cadena, no ocultar opciones. `[07:21]`, `[08:16]`<br>---", "quote": "Pero si yo me voy a las reglas de aprobación, para crearle un grupo de orden de compra, ahí quedo."}, {"mod": "VENTAS", "cls": "ventas", "title": "4. 4. DTE / GoSocket (PM) `[08:16 - 09:44]`", "body": "* **Lentitud sandbox:** Desde ~12:00 del dia anterior, GoSocket muy lento (~15 min por factura); impacta demo de PDF/XML en pantalla. Seguir emisiones reales pero tolerar demora en reunion. `[08:16]`, `[18:47]`<br>* **Plantilla PDF:** Documento interno personalizable se ve distinto al PDF GoSocket; validar paridad visual en otro hito. `[09:28]`<br>---", "quote": "O sea, es que tendrían cada uno de estos. De hecho, bueno, este es un documento interno que es el personalizable, por eso se va a ver un poco más diferente cuando veamos uno de GoSocket."}, {"mod": "PARAM", "cls": "param", "title": "5. 5. Proformas, asociacion factura y notificaciones (PM) `[09:44 - 19:34]`", "body": "* **Estados:** **Definitiva** = proforma asociada a ingreso diario; **Notificada** = envio de correo con tracking registrado. `[09:44]`, `[09:51]`<br>* **Asociar proforma-factura:** Una proforma **no** puede asociarse a mas de una factura ni reutilizar facturas ya calzadas. `[12:30]`, `[19:19]`, `[19:24]`<br>* **Feedback ta libro compras. `[23:52]`, `[24:35]`, `[25:23]`<br>* **Libro compras - UX:** Mostrar facturas de contratistas con **cobertura 100%** vs proforma; filtro/vista por proveedor **individual** (no solo total agregado); segunda etiqueta **contabilizada / pendiente** junto a OC o proforma vinculada. `[26:06]`, `[26:40]`, `[27:00]`<br>* **Calce modular:** Compras es checklist de documentos que llegan por GoSocket; el **reconocimiento de gasto** ocurre en cierre de cada modulo. `[01:04:40]`<br>* **Proformas sin factura en mes:** Puede haber proformas aprobadas en un mes y factura en el siguiente; facturas por recibir debe permitir detectar documentos faltantes. `[01:03:33]`, `[01:04:00]`<br>---", "quote": "¿Y la factura? ¿La factura en sí no queda contabilizada?"}, {"mod": "PARAM", "cls": "param", "title": "8. 8. Reversas y cierres de mes (PM) `[27:36 - 31:06]`", "body": "* **Mes contable cerrado:** Sin modificaciones directas; reversa vía **solicitud con doble VB** (contratistas + contabilidad). `[28:57]`, `[29:25]`<br>* **Dos niveles de cierre:** Cierre **modulo** (mensual operativo) vs cierre **contable** (periodo). Alinear botones: no reabrir centralizacion desde contabilidad si el modulo ya cerro; reversa desde proforma es el camino. `[29:03]`, `[30:54]`, `[31:06]`<br>* **Traspaso/cierre UI:** Mostrar **nombre completo** de cuenta/insumo ademas de codigo en resumen de centralizacion. `[22:28]`<br>---", "quote": "Con el mes cerrado no debería permitir hacer ninguna modificación."}, {"mod": "9.", "cls": "compras", "title": "9. 9. Insumos / bodega / guias en compras (PM) `[01:07:45 - 01:28:15]`", "body": "* **Pestaña compras:** En flujo compras-contratistas, donde hoy se habla de guias, debe poder asociarse **proforma aprobada** y contabilizar factura en modulo compras (no duplicar logica en contratistas). `[01:07:04]`, `[01:08:28]`<br>* **Cierre bodega ALM:** Consumo mensual por receta; ajustes de temporada al cierre. Separar **estado operativo** vs **estado contable** en columnas o doble etiqueta (aprobado vs contabilizado). `[01:28:08]`<br>---", "quote": "Entonces, en compras debería poder seleccionar la factura, la proforma, ¿cierto? Que es aprobada."}, {"mod": "10.", "cls": "compras", "title": "10. 10. DTE guias / recepcion insumos (PM) `[01:14:25 - 01:21:21]`", "body": "* **Recepcion vs maestro:** Matching de lineas por **codigo** de producto, no solo nombre (nombres truncados en pantalla). `[01:20:51]`, `[01:21:21]`<br>* **Habilitacion recepcion:** Ajustar reglas para permitir recepcionar cuando corresponda (caso probado en reunion con habilitacion manual). `[01:14:25]`<br>---", "quote": "Ya, perfecto, entonces ni me guío ni por el nombre ni por el código que venga en la guía de despacho, sino que se va a tipear manualmente."}, {"mod": "PARAM", "cls": "param", "title": "11. 11. Compromisos y proximos pasos", "body": "1. **Corregir wizard reversa proforma** (periodo abierto, doble VB, ocultar reversa en periodo cerrado). Responsable: Devint. Evidencia: AM `[01:32]`, `[03:24]`.<br>2. **Filtro proformas por periodo + indicador factura condicional.** Devint. AM `[30:02]`, `[30:55]`.<br>3. **Asociacion proforma-factura:** bloqueo 1:1, badge verde al cuadrar, notificacion mail al asociar, aviso a creador si descuadra. Devint. PM `[17:45]` - `[19:24]`.<br>4. **Libro compras contratistas:** contabilizar contra facturas por recibir, filtros y estado contabilizada/pendiente. Devint. PM `[25:23]` - `[26:45]`.<br>5. **OC insumos madre/hijas:** mantener regla ultima guia y multiples facturas por madre. Validar en QA. PM `[20:35]` - `[21:44]`.<br>6. **Roles/aprobaciones:** listado claro de usuarios al crear reglas OC. Devint. PM `[05:22]`, `[07:21]`.<br>7. **AlmaWeb (Jose/Mario/MJ):** documento de pendientes y correccion numeros + admin portal. **Fuera del repo ERP** pero bloqueante operativo. AM `[40:30]` - `[41:14]`.<br>8. **Segunda vuelta UX modulo compras** (vista libro / calce visual). Cliente PM `[26:56]`, `[27:23]`.<br>---", "quote": "Ah, ¿por qué no me levanta el wizard?"}, {"mod": "PARAM", "cls": "param", "title": "12. Referencias", "body": "- Parte AM en transcripcion: encabezado `## Parte AM`<br>- Parte PM en transcripcion: encabezado `## Parte PM`<br>- Informe consolidado previo (26-28/10): `docs/reuniones/analisis/13-informe-consolidado-lunes-martes-miercoles-2026-10-28.md` (no sustituye esta minuta)", "quote": ""}];
