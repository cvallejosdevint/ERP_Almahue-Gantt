<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>De dónde sale el dato.</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Parametrización", cls: "param",
        title: "1. Menú Contratista",
        img: "despues-menu.png",
        alt: "Menú con Parametrización y Contratistas abiertos, sin recuadros",
        pins: [
          { x: 9.2, y: 62.1, t: "Contratista", d: "Ítem nuevo de Parametrización. Abre el catálogo de labores, actividades, asociaciones, unidades y tipos de contrato. Asociación labores salió del menú Contratistas: esa ruta abre Proformas. Tarifas / labores pasó a llamarse Tarifas. No se guardó nada." }
        ]
      },
      {
        mod: "Parametrización", cls: "param",
        title: "2. Catálogo Contratista",
        img: "despues-parametrizacion.png",
        alt: "Pestañas del catálogo de contratista, sin recuadros",
        pins: [
          { x: 39.1, y: 21.6, t: "Pestañas", d: "Labores, actividades, el vínculo entre ambas, unidades de control y tipos de contrato. PACK-CER ya estaba cargado. El tipo de contrato de aquí es el que pide la tarifa y la proforma. No se apretó Nueva labor." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "3. Tarifa",
        img: "despues-tarifas.png",
        alt: "Alta de tarifa con el combo de unidad abierto, sin recuadros",
        pins: [
          { x: 64.2, y: 34.8, t: "Tipo de contrato", d: "Sale de Parametrización, pestaña Tipos de contrato. Antes el alta no lo pedía. No se eligió uno y no se apretó Crear." },
          { x: 64.2, y: 62.9, t: "Jornada o trato", d: "La unidad dejó de ser hora, hectárea o caja. El combo está abierto. No se apretó Crear." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "4. Ingreso diario",
        img: "despues-ingreso.png",
        alt: "Ingreso diario con las cuatro tarjetas, sin recuadros",
        pins: [
          { x: 27.9, y: 23.8, t: "Pendientes de proforma", d: "Cuenta los ingresos en estado PENDIENTE. Hay 1, el del 06-10, por $9.600. Ese monto es cantidad por precio. No se apretó Nuevo ingreso." },
          { x: 48.2, y: 23.8, t: "Monto del mes", d: "Suma los ingresos cuya fecha cae en octubre 2026, cualquier estado. El mismo registro de $9.600. No se apretó Nuevo ingreso." },
          { x: 68.5, y: 23.8, t: "En proforma", d: "Ingresos ya asociados a una proforma o facturados. En octubre van en cero. No se apretó Nuevo ingreso." },
          { x: 88.8, y: 23.8, t: "Overrides", d: "Ingresos cuyo precio no es el de la tarifa vigente. No hay excepciones. La columna Tarifa aplicada muestra $1.200 / jornada, el precio que tomó la fila." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "5. Nueva proforma",
        img: "despues-proformas.png",
        alt: "Alta de proforma con el ingreso marcado y el neto calculado, sin recuadros",
        pins: [
          { x: 35.8, y: 28.1, t: "Número", d: "Correlativo PF-00001. Se asigna al guardar. El campo no se edita en el alta. No se apretó Crear." },
          { x: 50.0, y: 55.9, t: "Ingreso pendiente", d: "Se eligió Cuadrillas Packing Export Ltda. El ingreso del 06-10, 8 jornada a $1.200, viene marcado. Sale del ingreso diario en estado pendiente, del mismo contratista y del periodo. No se apretó Crear." },
          { x: 50.0, y: 69.5, t: "Neto calculado", d: "El neto $9.600 es la suma de los ingresos marcados. Antes ese monto se digitaba. Falta el tipo de contrato: el aviso naranja lo pide antes de guardar. No se apretó Crear." }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
