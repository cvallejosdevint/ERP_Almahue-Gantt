<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Recorrido corregido. <a href="comparacion.html">Comparar con el caso que estaba mal</a>.</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Compras", cls: "compras",
        title: "1. La OC hereda 45 días",
        img: "despues-oc-plazo.png",
        alt: "Orden OC-2026-0005 con condición 45 días",
        pins: [
          { x: 31.6, y: 63.5, t: "45 días", d: "Proveedor QA-CRUCE PLAZO 45, RUT 76.111.222-8. Antes el combo solo dejaba 30, 60 o 90 y la orden quedaba en 30. El borrador se guardó. No se apretó Enviar a aprobación." }
        ]
      },
      {
        mod: "Compras", cls: "compras",
        title: "2. El IVA queda fuera de la cadena",
        img: "despues-oc-items.png",
        alt: "Ítem 10 por 100 dólares y total con IVA aparte",
        pins: [
          { x: 93.5, y: 51, t: "1.171.936 fuera de la cadena", d: "Total con IVA: 1.190 USD x 984,82 = 1.171.936 pesos. Ese monto no elige el grupo de aprobación. Antes el panel lo mostraba como total equivalente de la cadena." },
          { x: 52, y: 53.1, t: "Cadena por 984.820", d: "El neto se convierte una sola vez: 1.000 USD x 984,82 del 06-10-2026 = 984.820 pesos. Ese es el monto de la cadena. No se volvió a convertir." }
        ]
      },
      {
        mod: "Ventas", cls: "ventas",
        title: "3. Total CLP con el 10%",
        img: "despues-ov-descuento.png",
        alt: "Orden de venta 101606909119 con total 16.667 pesos",
        pins: [
          { x: 92.8, y: 63.4, t: "16.667 pesos", d: "OV 101606909119, descuento global 10%. Neto 18 USD x el tipo de cambio de la orden, 925,97, = 16.667. Antes el Total CLP salía en 18.519, sin el descuento. No se apretó Guardar." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "4. Tipo de cambio del 30-09",
        img: "despues-comprobante.png",
        alt: "Asiento 20260034 con dólar 969,7 y yuan 144,483",
        pins: [
          { x: 63.3, y: 52, t: "T dólar 969,7", d: "Asiento 20260034, FACTURA 9/2026, fecha 30-09-2026. El dólar es el de esa fila en Indicadores BC. Antes el comprobante podía mostrar el de otro día. Los pesos del asiento siguen en 290.598." },
          { x: 78.3, y: 52, t: "T yuan 144,483", d: "El yuan de la misma fila, 30-09-2026. Si ese día no tuviera indicador, la columna quedaría vacía. No se apretó Editar ni Imprimir." }
        ]
      },
      {
        mod: "Tesorería", cls: "teso",
        title: "5. Nómina: neto más IVA",
        img: "despues-nomina.png",
        alt: "Nómina 2026-09-S3 con desglose neto e IVA",
        pins: [
          { x: 27, y: 54.5, t: "199.900 + 37.981", d: "Semana 2026-09-S3, documento 33-1001, Agrícola Los Naranjos Ltda. El saldo sigue en 237.881. Ahora se lee neto 199.900 + IVA 37.981. El vencimiento 21-10-2026 no se movió. No se apretó Pagar." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "6. Preview de centralización",
        img: "despues-centralizacion.png",
        alt: "Preview de septiembre con ventas en 2.233.931 y bodega en cero",
        pins: [
          { x: 30.1, y: 58.5, t: "Ventas 2.233.931", d: "32 pendientes. Antes el preview sumaba solo el neto, 2.016.786. Ahora suma neto + IVA cuando el documento tiene IVA. Asientos creados: 0." },
          { x: 87.1, y: 58.5, t: "Bodega en 0", d: "0 pendientes, 44 omitidos, 0 pesos. La salida de venta no abona proveedores. Antes esa bodega sumaba 3.191.856. No se apretó Confirmar." }
        ]
      },
      {
        mod: "Tesorería", cls: "teso",
        title: "7. Base del pago en dólares",
        img: "despues-pago.png",
        alt: "Formulario de pago con base 984.820 pesos",
        pins: [
          { x: 70.5, y: 84.5, t: "Base 984.820", d: "Monto 1.000 USD, factura en CLP, TC 984,8200. La base es 1.000 x 984,82 = 984.820 pesos. Antes quedaba en 1,02 pesos. No se apretó Crear." }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "8. Piso de la cereza",
        img: "despues-piso.png",
        alt: "Artículo EX-CEREZA-CAJ con piso de costo promedio 1.850",
        pins: [
          { x: 68, y: 69.5, t: "Piso 1.850", d: "EX-CEREZA-CAJ sigue con precio de compra 0. El aviso dice que el piso vigente es el costo promedio, 1.850 pesos. No se apretó Guardar cambios." }
        ]
      },
      {
        mod: "Parametrización", cls: "param",
        title: "9. Yuan con indicador",
        img: "despues-monedas.png",
        alt: "Monedas con cuatro indicadores y el yuan en 146,84",
        pins: [
          { x: 87.5, y: 23.5, t: "Sincronizan con BC: 4", d: "USD, EUR, CNY y UF tienen indicador mayor que cero. Antes el contador quedaba en 0 porque el yuan no tenía serie." },
          { x: 49.2, y: 58.8, t: "Indicador 146,84", d: "El yuan muestra el último indicador, 146,84 pesos. No se inventó un código de serie del Banco Central y el sync sigue en Manual. No se apretó Sincronizar." }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
