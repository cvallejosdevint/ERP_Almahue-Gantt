<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido - Simulación de Reversas y Ajustes en Matriz 2x2</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1440px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; font-weight: 600; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 170px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .9; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
    .card h3 { margin: 0 0 4px; font-size: 0.95rem; }
    .card p { margin: 0; color: #44403c; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Simulación de Reversas y Ajustes en Matriz 2x2</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Ver Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Contratistas", cls: "param",
        title: "1. Caso 1: Reversa Directa con Clave Personal (Ambos Abiertos)",
        img: "despues-caso1-reversar-modal.png",
        alt: "Modal de reversa directa de proforma con clave personal",
        pins: [
          {
            x: 50.0, y: 50.2,
            t: "Clave de Reversa de Usuario",
            d: "El operador ingresa su clave personal de perfil. No requiere aprobador superior ni jefatura para revertir una proforma mientras el módulo y la contabilidad sigan abiertos."
          },
          {
            x: 60.1, y: 57.4,
            t: "Confirmación de Reversa",
            d: "Al confirmar, la proforma pasa a estado REVERSADA. Los ingresos diarios de labor permanecen vinculados, permitiendo editar centros de costo o tarifas sin tener que recapturar labores."
          }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "2. Caso 1: Proforma en Estado REVERSADA y Solicitud de Aprobación",
        img: "despues-caso1-proforma-reversada.png",
        alt: "Listado mostrando proforma reversada con opciones de edición y reingreso",
        pins: [
          {
            x: 77.0, y: 56.8,
            t: "Badge de Estado REVERSADA",
            d: "Identifica visualmente que el documento fue devuelto para corrección. Mantiene la trazabilidad histórica de reversas sin alterar proformas ya facturadas."
          },
          {
            x: 93.5, y: 56.8,
            t: "Acción Solicitar Aprobación",
            d: "Habilitada directamente sobre la proforma reversada tras corregir las imputaciones. Permite reenviar el documento para retornar a estado DEFINITIVA e ingresar al traspaso mensual."
          }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "3. Caso 2: Reapertura de Cierre con Desarme de Asiento Contable",
        img: "despues-caso2-reapertura.png",
        alt: "Panel de traspaso en caso 2 con formulario de reapertura de módulo",
        pins: [
          {
            x: 42.0, y: 35.8,
            t: "Estado de Período y Traspaso",
            d: "Muestra que el período contable general sigue ABIERTO y el cierre de Contratistas fue ejecutado bajo asiento CTR-2026-001."
          },
          {
            x: 51.2, y: 53.0,
            t: "Motivo Obligatorio de Reapertura",
            d: "Exige registrar una justificación formal de auditoría de al menos 5 caracteres para habilitar la reversión del cierre."
          },
          {
            x: 89.7, y: 53.0,
            t: "Botón Reabrir Cierre Contratistas",
            d: "Genera automáticamente el contra-asiento REVERSA-CTR:2026-10 en Contabilidad, elimina el bloqueo del mes y restituye las proformas a estado abierto para permitir la reversa del Caso 1."
          }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "4. Caso 3: Bloqueo de Traspaso y Alerta de Diferimiento",
        img: "despues-caso3-bloqueo.png",
        alt: "Panel de traspaso en caso 3 con botón de cierre inhabilitado por período contable cerrado",
        pins: [
          {
            x: 35.0, y: 35.8,
            t: "Período Contable CERRADO",
            d: "Indica que el mes de Contabilidad general se encuentra cerrado, impidiendo incorporar nuevos asientos sin reapertura contable previa."
          },
          {
            x: 58.3, y: 42.8,
            t: "Alerta de Bloqueo Contable",
            d: "Informa que no es posible centralizar en este mes cerrado. Las correcciones deben realizarse en Contratistas y el traspaso debe diferirse al siguiente mes contable abierto."
          },
          {
            x: 95.7, y: 10.8,
            t: "Botón Cerrar Mes Deshabilitado",
            d: "Inhabilitado preventivamente en la interfaz para impedir descuadres. El backend rechaza cualquier intento de traspaso con ConflictException."
          }
        ]
      },
      {
        mod: "Compras", cls: "compras",
        title: "5. Caso 4: Cierre Total y Comprobante de Ajuste Contable con PIN",
        img: "despues-caso4-ajuste-modal.png",
        alt: "Modal de Comprobante de Ajuste Contable con PIN de Reglas de Aprobación",
        pins: [
          {
            x: 58.3, y: 42.0,
            t: "Bloqueo de Reapertura y Regla de Ajuste",
            d: "Contratistas y Contabilidad cerrados. La reapertura está estrictamente bloqueada para proteger la inmutabilidad del balance contable histórico."
          },
          {
            x: 50.0, y: 39.5,
            t: "Selector de Proforma a Ajustar",
            d: "Permite individualizar la proforma histórica que requiere corrección de centro de costo o tarifa."
          },
          {
            x: 50.0, y: 59.6,
            t: "PIN de Reglas de Aprobación",
            d: "Exige obligatoriamente la validación del PIN de 4 dígitos. Verifica que el usuario sea Administrador o figure explícitamente en las Reglas de Aprobación activas del ERP."
          },
          {
            x: 57.3, y: 70.6,
            t: "Emitir Comprobante de Ajuste",
            d: "Genera el documento contable AJUSTE-CTR:2026-10 sin desarmar el asiento original de centralización cerrado."
          }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);

      s.pins.forEach((pn, pidx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `pin ${s.cls}` + (pidx === p ? " on" : "");
        btn.style.left = pn.x + "%";
        btn.style.top = pn.y + "%";
        btn.textContent = String(pidx + 1);
        btn.title = pn.t;
        btn.addEventListener("click", () => show(i, pidx));
        frame.appendChild(btn);
      });

      stage.appendChild(frame);
      const curr = s.pins[p];
      card.innerHTML = `<h3>${p + 1}. ${curr.t}</h3><p>${curr.d}</p>`;
    }

    prev.addEventListener("click", () => {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    });

    next.addEventListener("click", () => {
      if (pin < steps[step].pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prev.click();
      if (e.key === "ArrowRight") next.click();
    });

    show(0, 0);
  </script>
</body>
</html>
