<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido: Mejoras de COMEX, Tesorería y Compras</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 260px 1fr; gap: 12px; max-width: 1400px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Recorrido: Mejoras de COMEX, Tesorería y Compras</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Ver Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const STEPS = [
      {
        mod: "teso",
        label: "Tesorería",
        title: "1. Flujo de Caja con Proyecciones",
        img: "despues-flujo-caja.png",
        pins: [
          {
            n: 1,
            x: 82.5,
            y: 40.5,
            title: "Control de Inclusión de Proyecciones",
            body: "El selector 'Incluir proyecciones' incorpora los compromisos financieros de anticipos en estado PROYECTADO o CONFIRMADO en las salidas de caja proyectadas, sin alterar la contabilidad ni los saldos bancarios efectivos."
          }
        ]
      },
      {
        mod: "teso",
        label: "Tesorería",
        title: "2. Gestión de Compromisos de Anticipo",
        img: "despues-compromisos-anticipos.png",
        pins: [
          {
            n: 1,
            x: 91.5,
            y: 14.2,
            title: "Programación de Nuevo Compromiso",
            body: "Permite agendar anticipos a productores agrícolas (filtrados por esProductor), contratistas o proveedores, fijando semana de compromiso y banco estimado."
          }
        ]
      },
      {
        mod: "ventas",
        label: "Ventas",
        title: "3. Importador Masivo COMEX",
        img: "despues-comex-import.png",
        pins: [
          {
            n: 1,
            x: 48.0,
            y: 18.5,
            title: "Procesamiento Masivo de Instructivos Excel",
            body: "La carga de ACTUALIZABLE COMEX.xlsx analiza automáticamente los 14 instructivos de la temporada, consolidando cajas y kilos para generar Órdenes de Venta CONFIRMADAS listas para emitir Factura 110."
          }
        ]
      },
      {
        mod: "compras",
        label: "Compras",
        title: "4. Libro de Compras y Vencimientos",
        img: "despues-libro-compras-vencimientos.png",
        pins: [
          {
            n: 1,
            x: 52.0,
            y: 54.0,
            title: "Vencimiento Ligado a Fecha de Emisión SII",
            body: "El vencimiento de cada factura se calcula estrictamente sumando los días pactados a la fecha de emisión del documento SII (fechaDocumento), admitiendo condiciones diferenciadas (Neto en USD e IVA en CLP al día 20 F29)."
          }
        ]
      }
    ];

    let currentStep = 0;
    let currentPin = 0;

    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    function renderRail() {
      rail.innerHTML = "";
      STEPS.forEach((step, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "step" + (idx === currentStep ? " on" : "");
        btn.innerHTML =
          '<span class="n ' + step.mod + '">' + (idx + 1) + '</span>' +
          '<span><span class="mod">' + step.label + '</span><span class="ttl"><br>' + step.title + '</span></span>';
        btn.addEventListener("click", () => setStep(idx, 0));
        rail.appendChild(btn);
      });
    }

    function renderStage() {
      const step = STEPS[currentStep];
      title.textContent = step.title;
      stage.innerHTML =
        '<div class="frame">' +
          '<img src="' + step.img + '" alt="' + step.title + '" />' +
          step.pins.map((p, pIdx) =>
            '<button type="button" class="pin ' + step.mod + (pIdx === currentPin ? " on" : "") + '" style="left:' + p.x + '%; top:' + p.y + '%;" data-idx="' + pIdx + '">' + p.n + '</button>'
          ).join("") +
        '</div>';

      stage.querySelectorAll(".pin").forEach((pBtn) => {
        pBtn.addEventListener("click", (e) => {
          const idx = Number(e.currentTarget.getAttribute("data-idx"));
          setPin(idx);
        });
      });

      renderCard();
      renderRail();
      prevBtn.disabled = currentStep === 0 && currentPin === 0;
      nextBtn.disabled = currentStep === STEPS.length - 1 && currentPin === step.pins.length - 1;
    }

    function renderCard() {
      const step = STEPS[currentStep];
      const pin = step.pins[currentPin];
      if (!pin) {
        card.innerHTML = "<h3>" + step.title + "</h3><p>Sin detalles específicos.</p>";
        return;
      }
      card.innerHTML = "<h3>" + pin.title + "</h3><p>" + pin.body + "</p>";
    }

    function setStep(stepIdx, pinIdx) {
      currentStep = stepIdx;
      currentPin = pinIdx || 0;
      renderStage();
    }

    function setPin(pinIdx) {
      currentPin = pinIdx;
      stage.querySelectorAll(".pin").forEach((btn, idx) => {
        btn.classList.toggle("on", idx === currentPin);
      });
      renderCard();
      prevBtn.disabled = currentStep === 0 && currentPin === 0;
      nextBtn.disabled = currentStep === STEPS.length - 1 && currentPin === STEPS[currentStep].pins.length - 1;
    }

    prevBtn.addEventListener("click", () => {
      if (currentPin > 0) {
        setPin(currentPin - 1);
      } else if (currentStep > 0) {
        const prevStep = currentStep - 1;
        setStep(prevStep, STEPS[prevStep].pins.length - 1);
      }
    });

    nextBtn.addEventListener("click", () => {
      const step = STEPS[currentStep];
      if (currentPin < step.pins.length - 1) {
        setPin(currentPin + 1);
      } else if (currentStep < STEPS.length - 1) {
        setStep(currentStep + 1, 0);
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevBtn.click();
      if (e.key === "ArrowRight") nextBtn.click();
    });

    renderRail();
    renderStage();
  </script>
</body>
</html>
