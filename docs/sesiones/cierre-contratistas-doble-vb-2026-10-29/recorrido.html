<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido - Ciclo Completo de Reapertura, Doble Visto Bueno y Re-cierre</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1440px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; font-weight: 600; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 170px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 28px; height: 28px; margin: -14px 0 0 -14px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.45); z-index: 1; opacity: .75; cursor: pointer; transition: transform .15s ease, opacity .15s ease; }
    button.pin:hover { opacity: 1; transform: scale(1.1); }
    button.pin.on { width: 38px; height: 38px; margin: -19px 0 0 -19px; font-size: 16px; opacity: 1; outline: 3px solid #facc15; z-index: 5; transform: scale(1.05); }
    .card { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
    .card h3 { margin: 0 0 4px; font-size: 0.95rem; }
    .card p { margin: 0; color: #44403c; line-height: 1.4; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Ciclo de Doble Visto Bueno y Bandeja de Reversas</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Ver Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Contratistas", cls: "compras",
        title: "1. Solicitud de Reapertura con Justificación",
        img: "despues-paso1-solicitud-reapertura.png",
        alt: "Modal de solicitud formal de reapertura con justificación de ajuste y aviso de período contable cerrado",
        pins: [
          { x: 50.0, y: 56.8, t: "Justificación Obligatoria", d: "El administrativo ingresa el motivo fundado de la corrección (horas de cuadrilla en Cuartel 3). Al estar el mes contable cerrado, el sistema advierte que requerirá autorización previa con PIN de Contratistas y posteriormente de Contabilidad." },
          { x: 50.0, y: 64.1, t: "Aviso de Doble VºBº", d: "Al estar el período contable cerrado, el sistema bloquea la reapertura directa y notifica formalmente que se requerirá la aprobación secuencial del Administrador de Contratistas y del Administrador de Contabilidad." },
          { x: 56.4, y: 72.1, t: "Enviar Solicitud a Jefaturas", d: "Al pulsar Enviar Solicitud a Jefaturas, el sistema genera el folio SOL-REV-2026-001 y notifica internamente al Administrador de Contratistas para su primera revisión técnica." }
        ]
      },
      {
        mod: "Contratistas", cls: "compras",
        title: "2. Primer Visto Bueno (Jefatura de Contratistas con PIN)",
        img: "despues-paso2-vb-contratistas.png",
        alt: "Tarjeta de seguimiento de solicitud mostrando el primer visto bueno de Contratistas aprobado con PIN y esperando Contabilidad",
        pins: [
          { x: 90.0, y: 54.5, t: "Estado Solicitud: Esperando Contabilidad", d: "El badge superior refleja que el primer paso técnico está completado y que el flujo se encuentra derivado a Contabilidad." },
          { x: 39.2, y: 76.9, t: "1º VºBº Otorgado con PIN", d: "Pablo (Jefatura de Contratistas) validó en terreno la pertinencia del ajuste y autorizó ingresando su PIN de 4 dígitos. Queda constancia de fecha, hora y justificación técnica." },
          { x: 92.3, y: 78.2, t: "Derivación a Bandeja Contable", d: "Como el mes contable 2026-08 está cerrado, la proforma permanece resguardada y se habilita el acceso directo para el segundo visto bueno de Contabilidad." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "3. Bandeja de Reversas en Contabilidad (Segundo Visto Bueno con PIN)",
        img: "despues-paso3-menu-reversas-contabilidad.png",
        alt: "Bandeja de solicitudes de reversa en Contabilidad con modal de autorización PIN",
        pins: [
          { x: 8.5, y: 54.0, t: "Menú Solicitudes de Reversa", d: "Nuevo submódulo en Contabilidad (ubicado antes de Reportes) que centraliza, clasifica y audita todos los pedidos de reapertura provenientes de los módulos operativos." },
          { x: 50.0, y: 62.0, t: "Autorización con PIN Contable", d: "El Administrador de Contabilidad (Fran / Rodrigo) verifica la consistencia del balance e ingresa el PIN de 4 dígitos (4821) para firmar la reapertura autorizada." },
          { x: 56.0, y: 77.1, t: "Liberación de Proforma", d: "Al confirmar con PIN, la solicitud queda APROBADA y el sistema restituye la proforma a estado REVERSADA, notificando al administrativo solicitante que la edición se encuentra habilitada." }
        ]
      },
      {
        mod: "Contratistas", cls: "compras",
        title: "4. Proforma en Estado REVERSADA con Edición Habilitada",
        img: "despues-paso4-proforma-reversada-edicion.png",
        alt: "Listado de proformas con PRF-2026-020 en estado REVERSADA y editable",
        pins: [
          { x: 55.1, y: 43.5, t: "Proforma Reversada y Segura", d: "La proforma PRF-2026-020 adopta el estado REVERSADA manteniendo todas las cuadrillas y horas de labor intactas para su corrección puntual." },
          { x: 95.0, y: 43.5, t: "Edición y Re-envío", d: "El administrativo realiza los ajustes necesarios en horas o centros de costo y envía la proforma corregida a DEFINITIVA para habilitar la re-centralización del módulo." }
        ]
      },
      {
        mod: "Contratistas", cls: "compras",
        title: "5. Re-centralización y Auditoría del Cierre",
        img: "despues-paso5-re-cierre-auditoria.png",
        alt: "Panel de traspaso con módulo re-centralizado y tarjeta de auditoría con las firmas de Contratistas y Contabilidad",
        pins: [
          { x: 88.0, y: 54.5, t: "Re-centralización Contable", d: "El panel de traspaso registra el nuevo asiento CTR-2026-002-REC generado con las cifras corregidas de mano de obra." },
          { x: 50.0, y: 75.0, t: "Auditoría Histórica Inalterable", d: "Se despliega la tarjeta de trazabilidad con el historial completo de quién solicitó, quién otorgó el 1º VºBº (Contratistas) y quién autorizó el 2º VºBº (Contabilidad)." },
          { x: 94.0, y: 12.0, t: "Cierre Concluido y Notificado", d: "El indicador de cabecera confirma el estado Centralizado y el sistema despacha las notificaciones automáticas a ambas jefaturas informando el éxito del re-cierre." }
        ]
      }
    ];

    let step = 0;
    let pin = 0;

    const titleEl = document.getElementById("title");
    const railEl = document.getElementById("rail");
    const stageEl = document.getElementById("stage");
    const cardEl = document.getElementById("card");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    function renderRail() {
      railEl.innerHTML = steps.map((s, i) => `
        <button type="button" class="step ${i === step ? "on" : ""}" data-idx="${i}">
          <div class="n ${s.cls}">${i + 1}</div>
          <div>
            <div class="mod">${s.mod}</div>
            <div class="ttl">${s.title.replace(/^\\d+\\.\\s*/, "")}</div>
          </div>
        </button>
      `).join("");
      railEl.querySelectorAll("button.step").forEach(btn => {
        btn.addEventListener("click", () => {
          show(Number(btn.getAttribute("data-idx")), 0);
        });
      });
    }

    function show(sIdx, pIdx) {
      const stepChanged = (step !== sIdx);
      step = sIdx;
      pin = pIdx;

      const current = steps[step];
      titleEl.textContent = current.title;

      let frame = stageEl.querySelector(".frame");
      if (stepChanged || !frame) {
        stageEl.innerHTML = `
          <div class="frame">
            <img src="${current.img}" alt="${current.alt}" />
            ${current.pins.map((p, idx) => `
              <button type="button" class="pin ${current.cls} ${idx === pin ? "on" : ""}" style="left:${p.x}%; top:${p.y}%;" data-pin="${idx}">
                ${idx + 1}
              </button>
            `).join("")}
          </div>
        `;
        stageEl.querySelectorAll("button.pin").forEach(pinBtn => {
          pinBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            show(step, Number(pinBtn.getAttribute("data-pin")));
          });
        });
        renderRail();
      } else {
        stageEl.querySelectorAll("button.pin").forEach((pBtn, idx) => {
          if (idx === pin) pBtn.classList.add("on");
          else pBtn.classList.remove("on");
        });
      }

      const item = current.pins[pin] || current.pins[0];
      cardEl.innerHTML = `
        <h3>Pin ${pin + 1}: ${item.t}</h3>
        <p>${item.d}</p>
      `;

      prevBtn.disabled = (step === 0 && pin === 0);
      nextBtn.disabled = (step === steps.length - 1 && pin === current.pins.length - 1);
    }

    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) {
        show(step, pin + 1);
      } else if (step < steps.length - 1) {
        show(step + 1, 0);
      }
    }

    function back() {
      if (pin > 0) {
        show(step, pin - 1);
      } else if (step > 0) {
        show(step - 1, steps[step - 1].pins.length - 1);
      }
    }

    prevBtn.addEventListener("click", back);
    nextBtn.addEventListener("click", forward);

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") back();
      else if (e.key === "ArrowRight") forward();
    });

    show(0, 0);
  </script>
</body>
</html>
