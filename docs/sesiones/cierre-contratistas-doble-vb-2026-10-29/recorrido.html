<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido - Ciclo Completo de Reapertura, Doble Visto Bueno y Re-cierre</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1440px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 280px 1fr; gap: 12px; max-width: 1440px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 6px 8px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; font-weight: 600; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 170px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .9; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
    .card h3 { margin: 0 0 4px; font-size: 0.95rem; }
    .card p { margin: 0; color: #44403c; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Ciclo de Doble Visto Bueno y Bandeja de Reversas</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Ver Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Contratistas", cls: "compras",
        title: "1. Solicitud de Reapertura con Justificación",
        img: "despues-paso1-solicitud-reapertura.png",
        alt: "Modal de solicitud formal de reapertura con justificación de ajuste y aviso de período contable cerrado",
        pins: [
          { x: 50, y: 48, t: "Justificación Obligatoria", d: "El administrativo ingresa el motivo fundado de la corrección (horas de cuadrilla en Cuartel 3). Al estar el mes contable cerrado, el sistema advierte que requerirá autorización previa con PIN de Contratistas y posteriormente de Contabilidad." },
          { x: 61, y: 63, t: "Enviar Solicitud", d: "Al pulsar Enviar Solicitud a Jefaturas, el sistema genera el folio SOL-REV-2026-001 y notifica internamente al Administrador de Contratistas para su primera revisión técnica." }
        ]
      },
      {
        mod: "Contratistas", cls: "compras",
        title: "2. Primer Visto Bueno (Jefatura de Contratistas con PIN)",
        img: "despues-paso2-vb-contratistas.png",
        alt: "Tarjeta de seguimiento de solicitud mostrando el primer visto bueno de Contratistas aprobado con PIN y esperando Contabilidad",
        pins: [
          { x: 33, y: 64, t: "1º VºBº Otorgado", d: "Pablo (Gerente de Campo) revisó la solicitud y firmó electrónicamente con su clave PIN de 4 dígitos (4821). El sistema registra su nombre, fecha y observación de validación en terreno." },
          { x: 72, y: 64, t: "Paso 2: Pendiente en Contabilidad", d: "Como el mes contable 2026-08 se encuentra cerrado, la proforma aún no se libera y la solicitud se deriva a la bandeja contable con botón directo para ingresar a evaluarla." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "3. Bandeja de Reversas en Contabilidad (Segundo Visto Bueno con PIN)",
        img: "despues-paso3-menu-reversas-contabilidad.png",
        alt: "Bandeja de solicitudes de reversa en Contabilidad con modal de autorización PIN",
        pins: [
          { x: 8, y: 54, t: "Menú Solicitudes de Reversa", d: "Nuevo ítem en Contabilidad ubicado antes de Reportes para concentrar y auditar todos los pedidos de reversa y reapertura de los módulos operativos." },
          { x: 50, y: 48, t: "Autorización con PIN Contable", d: "Fran / Rodrigo valida el impacto en balance e ingresa el PIN de 4 dígitos. Al confirmar, se libera la proforma a estado REVERSADA permitiendo corregir cuadrillas sin alterar los mayores contables." }
        ]
      },
      {
        mod: "Contratistas", cls: "compras",
        title: "4. Proforma en Estado REVERSADA con Edición Habilitada",
        img: "despues-paso4-proforma-reversada-edicion.png",
        alt: "Listado de proformas con PRF-2026-020 en estado REVERSADA y editable",
        pins: [
          { x: 52, y: 46, t: "Proforma Reversada", d: "La proforma PRF-2026-020 figura con badge REVERSADA y sus ingresos de labor diarios intactos, lista para modificar horas, cuarteles o centros de costo." },
          { x: 95, y: 46, t: "Edición y Re-aprobación", d: "El solicitante María José realiza los ajustes y envía la proforma corregida a DEFINITIVA para habilitar la re-centralización del módulo." }
        ]
      },
      {
        mod: "Contratistas", cls: "compras",
        title: "5. Re-centralización y Auditoría del Cierre",
        img: "despues-paso5-re-cierre-auditoria.png",
        alt: "Panel de traspaso con módulo re-centralizado y tarjeta de auditoría con las firmas de Contratistas y Contabilidad",
        pins: [
          { x: 50, y: 68, t: "Auditoría de Doble Firma", d: "La tarjeta de auditoría registra permanentemente la aprobación de Pablo (Gerente de Campo) y Fran / Rodrigo (Contabilidad), junto al nuevo comprobante contable CTR-2026-002-REC." },
          { x: 94, y: 12, t: "Módulo Centralizado", d: "El botón de cabecera confirma el estado Centralizado y notifica automáticamente a ambas jefaturas informando que el período ha quedado balanceado con el detalle modificado." }
        ]
      }
    ];

    let currentStep = 0;
    let currentPin = 0;

    const titleEl = document.getElementById("title");
    const railEl = document.getElementById("rail");
    const stageEl = document.getElementById("stage");
    const cardEl = document.getElementById("card");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");

    function renderRail() {
      railEl.innerHTML = steps.map((s, i) => `
        <button type="button" class="step ${i === currentStep ? "on" : ""}" data-idx="${i}">
          <div class="n ${s.cls}">${i + 1}</div>
          <div>
            <div class="mod">${s.mod}</div>
            <div class="ttl">${s.title.replace(/^\\d+\\.\\s*/, "")}</div>
          </div>
        </button>
      `).join("");
      railEl.querySelectorAll("button.step").forEach(btn => {
        btn.addEventListener("click", () => {
          currentStep = Number(btn.getAttribute("data-idx"));
          currentPin = 0;
          render();
        });
      });
    }

    function render() {
      const step = steps[currentStep];
      titleEl.textContent = step.title;
      prevBtn.disabled = currentStep === 0;
      nextBtn.disabled = currentStep === steps.length - 1;

      stageEl.innerHTML = `
        <div class="frame">
          <img src="${step.img}" alt="${step.alt}" />
          ${step.pins.map((p, idx) => `
            <button type="button" class="pin ${step.cls} ${idx === currentPin ? "on" : ""}" style="left:${p.x}%; top:${p.y}%;" data-pin="${idx}">
              ${idx + 1}
            </button>
          `).join("")}
        </div>
      `;

      stageEl.querySelectorAll("button.pin").forEach(pinBtn => {
        pinBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          currentPin = Number(pinBtn.getAttribute("data-pin"));
          renderCard();
          updatePins();
        });
      });

      renderRail();
      renderCard();
    }

    function updatePins() {
      stageEl.querySelectorAll("button.pin").forEach((p, idx) => {
        if (idx === currentPin) p.classList.add("on");
        else p.classList.remove("on");
      });
    }

    function renderCard() {
      const step = steps[currentStep];
      const pin = step.pins[currentPin] || step.pins[0];
      cardEl.innerHTML = `
        <h3>Pin ${currentPin + 1}: ${pin.t}</h3>
        <p>${pin.d}</p>
      `;
    }

    prevBtn.addEventListener("click", () => {
      if (currentStep > 0) {
        currentStep--;
        currentPin = 0;
        render();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentStep < steps.length - 1) {
        currentStep++;
        currentPin = 0;
        render();
      }
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevBtn.click();
      else if (e.key === "ArrowRight") nextBtn.click();
    });

    render();
  </script>
</body>
</html>
