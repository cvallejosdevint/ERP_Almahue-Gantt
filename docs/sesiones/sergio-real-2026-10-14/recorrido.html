<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido real para Sergio</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Recorrido real, 14 de octubre. Lo guardado y lo que ya estaba.</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Compras", cls: "compras",
        title: "1. Orden nueva",
        img: "despues-oc-items.png",
        alt: "Ítem de la orden a Insumos Packing Sur",
        pins: [
          { x: 42, y: 38, t: "Ítem de la 0018", d: "Descripción Cajas packing cereza, centro 1002 VENTA EXPORTACIÓN CEREZAS, cuenta 6-1-01-02-004 COSTO MATERIALES DE EMBALAJE, cantidad 10, precio 4.800. Neto $48.000. Proveedor Insumos Packing Sur SpA, fecha 14-10-2026, CLP, afecto. Se apretó Confirmar sin aprobación porque el monto no alcanza el primer escalón. Quedó OC-2026-0018 aprobada." }
        ]
      },
      {
        mod: "Compras", cls: "compras",
        title: "2. Recepción parcial",
        img: "despues-recepcion-lista.png",
        alt: "Recepción confirmada de la 0018 por 20000",
        pins: [
          { x: 48, y: 42, t: "Recibido $20.000", d: "Recepción del 14-10-2026, TC 1, CLP, estado confirmada, sobre OC-2026-0018. Es parcial: el neto de la orden era $48.000. No se recepcionó el saldo." }
        ]
      },
      {
        mod: "Compras", cls: "compras",
        title: "3. Cierre de saldo de José",
        img: "despues-cierre-modal.png",
        alt: "Modal de cierre con saldo hacia la hija",
        pins: [
          { x: 57.5, y: 72.5, t: "Ajustar y crear OC hija", d: "Neto original $48.000, recibido confirmado $20.000, saldo $28.000. Motivo: Recepcion parcial de cajas packing. El saldo queda en la OC hija. Ese botón se apretó después de la foto. La madre baja a $20.000 y vuelve a pendiente de aprobación. La hija nace en borrador." }
        ]
      },
      {
        mod: "Compras", cls: "compras",
        title: "4. Cómo se asocian",
        img: "despues-lista-hija.png",
        alt: "La hija 0019 dice Hija de la 0018",
        pins: [
          { x: 22.5, y: 42.4, t: "Hija de #OC-2026-0018", d: "OC-2026-0019, $28.000, borrador. El vínculo es el que dejó José en el listado de Compras: la hija muestra el número de la madre. La madre OC-2026-0018 quedó en $20.000, pendiente de aprobación. No hay pantalla aparte en Insumos. No se volvió a aprobar." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "5. Ingreso real",
        img: "despues-ingreso-lista.png",
        alt: "Ingreso del 14 de octubre pendiente",
        pins: [
          { x: 22.7, y: 51.8, t: "Ingreso 14-10", d: "Cuadrillas Packing Export Ltda, centro 1002, PACK-CER, SEL-CER, jornada, 8 por $1.200. Monto $9.600, pendiente. El del 06-10 sigue aparte. No se aprobó el ingreso." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "6. Proforma real",
        img: "despues-proforma-lista.png",
        alt: "Proforma PF-00001 en borrador",
        pins: [
          { x: 21.7, y: 44.4, t: "PF-00001", d: "Periodo 2026-10, $9.600, borrador. Toma solo el ingreso del 14-10. No se apretó Solicitar aprobación, PDF, E-mail ni Facturar." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "7. Venta ya contabilizada",
        img: "asientos.png",
        alt: "Comprobantes de octubre",
        pins: [
          { x: 20.8, y: 61.7, t: "20260041", d: "Asiento de la orden de venta 101606909139, glosa FACTURA 10, $2.202. El 20260039 es la factura de compra 61, $11.305. Ya estaban. No se creó un comprobante nuevo." }
        ]
      },
      {
        mod: "Ventas", cls: "ventas",
        title: "8. Libro de ventas",
        img: "libro-ventas.png",
        alt: "Libro de ventas de octubre",
        pins: [
          { x: 27.5, y: 74.3, t: "Orden 101606909139", d: "La orden facturada de ALM SERVICES. El folio del libro es el 92, neto $1.850, y el asiento usa el total $2.202. No se emitió otro DTE." }
        ]
      },
      {
        mod: "Parametrización", cls: "param",
        title: "9. Correo",
        img: "correo.png",
        alt: "Configuración SMTP ya cargada",
        pins: [
          { x: 28, y: 22, t: "Servidor ya configurado", d: "Administración, Configuración de correos. El servidor ya está cargado. No se apretó Guardar servidor y no se envió un aviso de la proforma ni de la orden." }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
