<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido - contratistas, olas A-C</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>De dónde sale el dato. <a href="comparacion.html">Comparación</a></h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Contratistas", cls: "param",
        title: "1. Menú",
        img: "despues-menu.png",
        alt: "Menú de Contratistas con los tres ítems nuevos, sin recuadros",
        pins: [
          { x: 9.5, y: 37.4, t: "Registro múltiple", d: "Ítem nuevo. Abre el lote de varias filas en la misma fecha. No se guardó ningún ingreso." },
          { x: 9.5, y: 40.7, t: "Reporte ingresos", d: "Ítem nuevo. Abre el filtro por contratista y fechas. No se buscó ni se exportó." },
          { x: 9.5, y: 50.2, t: "Envío operativo", d: "Ítem nuevo. Abre el paquete de proformas ya notificadas. No se creó un envío." }
        ]
      },
      {
        mod: "Parametrización", cls: "param",
        title: "2. Sectores y faenas",
        img: "despues-parametrizacion.png",
        alt: "Parametrización de contratista en la pestaña Sectores, sin recuadros",
        pins: [
          { x: 36.1, y: 21.6, t: "Sectores", d: "Pestaña nueva. El listado no cargó: el API local no tiene este catálogo. No se apretó Nuevo sector." },
          { x: 41.0, y: 21.6, t: "Faenas", d: "Pestaña nueva, al lado de Sectores. Tipos de contrato salió de esta pantalla. No se abrió Faenas." },
          { x: 92.5, y: 29.9, t: "Nuevo sector", d: "Alta del catálogo. No se apretó." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "3. Tarifa sin tipo de contrato",
        img: "despues-tarifas.png",
        alt: "Alta de tarifa con la unidad abierta, sin recuadros",
        pins: [
          { x: 35.8, y: 55.6, t: "Unidad", d: "Sigue siendo jornada o trato. Tipo de contrato ya no está en el alta. No se eligió una unidad y no se apretó Crear." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "4. Ingreso con sector",
        img: "despues-ingreso-form.png",
        alt: "Nuevo ingreso con Sector abierto, sin recuadros",
        pins: [
          { x: 35.7, y: 53.4, t: "Predio", d: "Campo nuevo, opcional. Al lado está Temporada, también opcional. No se escribió nada." },
          { x: 35.7, y: 63.5, t: "Sector", d: "Combo nuevo, abierto. Dice Sin resultados porque el catálogo no está en el API local. Faena está a la derecha. No se apretó Crear." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "5. Proforma definitiva",
        img: "despues-proformas.png",
        alt: "Proforma 00001 con PDF, E-mail y Notificar contratista, sin recuadros",
        pins: [
          { x: 65.6, y: 44.8, t: "PDF", d: "Imprime la proforma 00001, Cuadrillas Packing Export Ltda, $175.000, periodo 2026-09. No se apretó." },
          { x: 75.9, y: 44.8, t: "Notificar contratista", d: "Pasa la proforma de DEFINITIVA a notificada. Facturar ya no está en este estado. No se apretó Notificar ni E-mail." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "6. Registro múltiple",
        img: "despues-multiple.png",
        alt: "Lote de ingreso múltiple, sin recuadros y sin guardar",
        pins: [
          { x: 23.3, y: 44.2, t: "Añadir fila", d: "Suma otra línea al lote del 13/10/2026. Si la faena se repite, el guardado junta las cantidades. No se apretó Añadir fila ni Guardar registros." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "7. Reporte de ingresos",
        img: "despues-reporte.png",
        alt: "Filtros del reporte, sin buscar",
        pins: [
          { x: 81.1, y: 25.1, t: "Buscar", d: "Arma el detalle por contratista y por día. Contratista está en Todos y las fechas vacías. No se apretó Buscar ni Exportar CSV." }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "8. Envío operativo",
        img: "despues-envio.png",
        alt: "Paquete de envío sin proformas elegibles, sin crear",
        pins: [
          { x: 38.6, y: 32.6, t: "Período desde", d: "Ejemplo 2026-07, no se escribió un periodo. Hay 0 proformas elegibles: la 00001 sigue DEFINITIVA. No se apretó Crear envío operativo." }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
