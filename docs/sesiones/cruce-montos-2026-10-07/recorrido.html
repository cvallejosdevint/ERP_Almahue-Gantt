<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido cruce de montos</title>

    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; }
    .actions button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: 1; outline: 3px solid #fff; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .leyenda { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
    .leyenda button { font: inherit; cursor: pointer; border: 0; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700; padding: 3px 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .chip { display: inline-block; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; }
    .nexo { margin: 0 0 6px; padding: 6px 8px; border-radius: 8px; background: #fafaf9; border-left: 4px solid var(--anillo, #a8a29e); }
    .saltos { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .saltos button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: #fafaf9; border-radius: 8px; padding: 3px 8px; font-size: 12px; }
    .dots { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .velo { position: absolute; inset: 0; background: rgba(28,25,23,.28); border-radius: 10px; z-index: 2; }
    .debe { position: absolute; z-index: 5; transform: translate(0, -115%); background: #fff; border: 2px solid #15803d; border-radius: 8px; padding: 3px 7px; font-size: 12px; line-height: 1.2; max-width: 168px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
    .debe.der { transform: translate(-100%, -115%); }
    .debe.abajo { transform: translate(0, 6px); }
    .debe.der.abajo { transform: translate(-100%, 6px); }
    .debe .mal { display: block; color: #be123c; text-decoration: line-through; }
    .debe .bien { display: block; color: #15803d; font-weight: 700; }
    .dialog { position: absolute; z-index: 6; top: 8px; left: 8px; width: min(280px, 34%); max-height: 32%; overflow: auto; background: #fff; border: 2px solid #15803d; border-radius: 12px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .dialog h3 { margin: 0 0 4px; font-size: 0.95rem; }
    .dialog ul { margin: 0; padding-left: 18px; }
    .dialog li { margin: 2px 0; }
    .dialog p { margin: 6px 0 0; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>

      { nota: "Esta pantalla es la referencia del 06-10. No se cambian estos números. La OC y el pago de ese día usan $984,82. La OV en 925,97 y la centralización en 965,50 son las que hay que alinear con la fecha de cada documento.", items: [

    let step = 0, pin = 0, corrigiendo = false;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");
    const leyenda = document.getElementById("leyenda");

    function anillo(item) {
      const hs = listaH(item);
      if (hs.length === 1) return "0 0 0 3px " + hilos[hs[0]].color;
      return "0 0 0 3px " + hilos[hs[0]].color + ", 0 0 0 6px " + hilos[hs[1]].color;
    }

    Object.keys(hilos).forEach((id) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = id + " " + hilos[id].nombre;
      b.style.background = hilos[id].color;
      b.addEventListener("click", () => {
        for (let i = 0; i < steps.length; i++) {
          const p = steps[i].pins.findIndex((item) => listaH(item).includes(id));
          if (p >= 0) { show(i, p); break; }
        }
      });
      leyenda.appendChild(b);
    });

    steps.forEach((s, i) => {
      const ids = [...new Set(s.pins.flatMap(listaH))];
      const dots = ids.map((id) => `<i style="background:${hilos[id].color}" title="${hilos[id].nombre}"></i>`).join("");
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}<span class="dots">${dots}</span></span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      corrigiendo = false;
      step = i; pin = p;
      const s = steps[i];
      const item = s.pins[p];
      const hs = listaH(item);
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = false;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((pinItem, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = pinItem.x + "%";
        b.style.top = pinItem.y + "%";
        b.style.boxShadow = anillo(pinItem);
        b.textContent = String(idx + 1);
        b.title = listaH(pinItem).map((id) => hilos[id].nombre).join(", ") + ": " + pinItem.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const chips = hs.map((id) => `<span class="chip" style="background:${hilos[id].color}">${id} ${hilos[id].nombre}</span>`).join("");
      const saltos = (item.va || []).map((idx) => `<button type="button" data-ir="${idx}">Ir al paso ${idx + 1}</button>`).join("");
      card.innerHTML = `<div class="chips">${chips}</div><h3>${item.t}</h3><p class="nexo" style="--anillo:${hilos[hs[0]].color}">${item.nexo}</p><p>${item.d}</p><div class="saltos">${saltos}</div>`;
      card.querySelectorAll("[data-ir]").forEach((b) => b.addEventListener("click", () => {
        const dest = Number(b.dataset.ir);
        const shared = steps[dest].pins.findIndex((pinItem) => listaH(pinItem).some((id) => hs.includes(id)));
        show(dest, shared >= 0 ? shared : 0);
      }));
    }
    function enterCorr() {
      corrigiendo = true;
      const s = steps[step];
      const c = corrs[step];
      title.textContent = s.title + " · Corrección";
      prev.disabled = false;
      next.disabled = step === steps.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === step));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      const velo = document.createElement("div");
      velo.className = "velo";
      frame.appendChild(velo);
      c.items.forEach((it) => {
        const tag = document.createElement("div");
        const abajo = it.y < 72;
        tag.className = "debe" + (it.x >= 60 ? " der" : "") + (abajo ? " abajo" : "");
        tag.style.left = it.x + "%";
        tag.style.top = (it.y < 30 ? 30 : it.y) + "%";
        if (it.mal) {
          const mal = document.createElement("span");
          mal.className = "mal";
          mal.textContent = it.chipMal || it.mal;
          tag.appendChild(mal);
        }
        const bien = document.createElement("span");
        bien.className = "bien";
        bien.textContent = it.chip || it.bien;
        tag.appendChild(bien);
        frame.appendChild(tag);
      });
      const dialog = document.createElement("div");
      dialog.className = "dialog";
      dialog.setAttribute("role", "dialog");
      const h = document.createElement("h3");
      h.textContent = "Cómo debería verse";
      dialog.appendChild(h);
      const ul = document.createElement("ul");
      c.items.forEach((it) => {
        const li = document.createElement("li");
        li.textContent = (it.mal ? it.mal + " pasa a " : "") + it.bien + (it.nota ? ". " + it.nota : "");
        ul.appendChild(li);
      });
      dialog.appendChild(ul);
      const pie = document.createElement("p");
      pie.textContent = c.nota;
      dialog.appendChild(pie);
      frame.appendChild(dialog);
      stage.appendChild(frame);
      card.innerHTML = "<h3>Corrección de esta pantalla</h3><p>" + c.nota + "</p>";
    }
    function forward() {
      const s = steps[step];
      if (corrigiendo) {
        if (step < steps.length - 1) show(step + 1, 0);
        return;
      }
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else enterCorr();
    }
    function back() {
      if (corrigiendo) {
        show(step, steps[step].pins.length - 1);
        return;
      }
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
