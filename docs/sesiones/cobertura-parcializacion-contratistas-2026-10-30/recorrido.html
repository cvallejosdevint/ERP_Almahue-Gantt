<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido - Cobertura de Parcialización, Exportación y Administradores</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>De dónde sale el dato</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Compras", cls: "compras",
        title: "1. Barra de Cobertura y Exportación en Libro de Compras",
        img: "despues-libro-compras.png",
        alt: "Libro de compras con indicador de parcialización y botones de exportación",
        pins: [
          {
            x: 36.9, y: 82.7,
            t: "Barra de Cobertura de Parcialización",
            d: "Calcula en tiempo real la cobertura entre la factura recepcionada y las proformas de contratistas asociadas (FAC-CTR-9901 con PRF-2026-020 al 63%, con $4.800.000 cubiertos y saldo pendiente de $2.800.000). También aplica en compras para el avance de facturación de OC madre/hijas."
          },
          {
            x: 84.8, y: 69.7,
            t: "Exportación Universal Excel y PDF",
            d: "Genera el reporte oficial en Excel o documento PDF con membrete corporativo, respetando el logotipo, orientación y paleta de colores configurada en la Plantilla de Documentos de la empresa."
          }
        ]
      },
      {
        mod: "Administración", cls: "param",
        title: "2. Administradores por Concepto en Modo Demo",
        img: "despues-administradores.png",
        alt: "Módulos de administración con administradores asignados para pruebas demo",
        pins: [
          {
            x: 58.3, y: 51.4,
            t: "Administrador de Contratistas",
            d: "Pablo Morales (Gerente de Campo) queda registrado como administrador del concepto Contratistas para emitir el primer visto bueno técnico ante solicitudes de reapertura."
          },
          {
            x: 58.3, y: 68.8,
            t: "Jefe de Insumos / Bodega",
            d: "Mario Céspedes (Jefe de Bodega / Operaciones) cuenta con facultades de jefatura de área para autorizar y coordinar las órdenes madre de insumos."
          },
          {
            x: 58.3, y: 86.4,
            t: "Administrador de Contabilidad",
            d: "Rodrigo Valdés gestiona el segundo visto bueno con PIN en solicitudes de reversa contable y reapertura de periodos cerrados."
          }
        ]
      },
      {
        mod: "Contratistas", cls: "param",
        title: "3. Exportación Universal en Proformas de Contratistas",
        img: "despues-proformas.png",
        alt: "Listado de proformas con botones de exportación",
        pins: [
          {
            x: 84.8, y: 47.9,
            t: "Exportación de Proformas a Planilla y PDF",
            d: "Habilita la descarga de todas las proformas del periodo filtrado tanto en planilla Excel como en reporte PDF formateado."
          }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "4. Cobertura en Órdenes Madre de Insumos",
        img: "despues-ordenes-insumos.png",
        alt: "Listado de órdenes de insumos con columna de cobertura y exportación",
        pins: [
          {
            x: 36.7, y: 56.5,
            t: "Cobertura de Orden Madre",
            d: "Muestra el avance de insumos comprometidos en la orden madre frente a sus hijas generadas y facturadas (OC-2026-0006 con $100.000 cubierto por hijas y 2 de 2 facturadas)."
          },
          {
            x: 84.8, y: 47.5,
            t: "Exportación de Órdenes de Insumos",
            d: "Descarga la lista de órdenes madre e hijas a Excel y PDF con diseño corporativo."
          }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((pn, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "pin " + s.cls + (idx === p ? " on" : "");
        btn.style.left = pn.x + "%";
        btn.style.top = pn.y + "%";
        btn.textContent = idx + 1;
        btn.addEventListener("click", () => show(i, idx));
        frame.appendChild(btn);
      });
      stage.appendChild(frame);
      const cur = s.pins[p];
      card.innerHTML = `<h3>${cur.t}</h3><p>${cur.d}</p>`;
    }

    prev.addEventListener("click", () => {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    });

    next.addEventListener("click", () => {
      if (pin < steps[step].pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" && !prev.disabled) prev.click();
      else if (e.key === "ArrowRight" && !next.disabled) next.click();
    });

    show(0, 0);
  </script>
</body>
</html>
