<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido semana 27/10 a 05/11</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; max-height: calc(100vh - 24px); overflow: auto; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>Semana 27/10 a 05/11. De donde sale el dato.</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Admin", cls: "param",
        title: "1. Organigrama & Reglas de Aprobación: estructura unificada",
        img: "despues-organigrama.png",
        alt: "Organigrama y reglas de aprobación de la organización",
        pins: [
          {
            x: 58.3, y: 26.9, t: "Resumen de Jerarquía y Topes",
            d: "Tarjetas KPI plegables con total de ramas (5), eslabones (21), personas asignadas (40) y Techo Supremo de Decisión (Rango 1 · Gerencia General, Sin Límite). Acordado con Fran y MJ el 05/11."
          },
          {
            x: 91.5, y: 41.8, t: "+ Nueva Rama y + Nuevo Eslabón",
            d: "Gestión dinámica de estructura: permite crear ramas operativas paralelas, agregar cargos jerárquicos con rango 1 a 4, topes multimoneda (CLP/USD) y visación individual o colegiada."
          },
          {
            x: 58.3, y: 62.0, t: "Estrato de Ramas y Árbol de Mando",
            d: "Nivel 1 de Dirección General en el vértice superior y niveles 2 operativos en paralelo (Agrícola, Packing, Administración, Contratistas). Subrangos automáticos (3.1, 3.2, 3.3) o escalas secuenciales según tramos de monto."
          }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "2. Packings: ficha tipo proveedor",
        img: "despues-packings.png",
        alt: "Mantenedor Packings",
        pins: [
          {
            x: 93.3, y: 11.2, t: "Nuevo packing",
            d: "Alta con RUT, razón social, contacto y dirección. Al crear, el backend arma bodega Packing · razón social. No se pulsó el botón en esta captura."
          },
          {
            x: 58.3, y: 16.2, t: "Flujo MJ",
            d: "Aviso: recepción > traspaso guía 52 > receta > producción > cierre. Guía DTE 52 a packing sigue pendiente de QA. Solo lectura."
          }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "3. Recetas y producción por packing",
        img: "despues-ordenes-aplicacion-packing.png",
        alt: "Pestaña Recetas packing en Órdenes de aplicación",
        pins: [
          {
            x: 33.6, y: 37.7, t: "Recetas packing",
            d: "Lo construido esta semana: plantilla Almahue y packing ligado, periodo 2026-08. La reunion del 05/11 pidio despues soltar el packing de la receta y repartir el consumo. No se guardó ni importó CSV."
          },
          {
            x: 43.3, y: 37.7, t: "Producción packing",
            d: "Declaración mensual: packing + receta + cajas. Genera movimientos CONSUMO_PACKING. Aquí solo se muestra la pestaña. No se confirmó producción."
          }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "4. Asientos: Quién / cuándo",
        img: "despues-asientos.png",
        alt: "Columna Quién / cuándo en listado de asientos",
        pins: [
          {
            x: 66.2, y: 49.3, t: "Quién / cuándo",
            d: "Campos creadoPorId / Nombre / Email al grabar asiento manual. Migración 20261105180000. Vista con Todos para ver filas fuera de 2026-11. No se editó glosa ni montos."
          }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "5. Balance 8: desde 1 de enero",
        img: "despues-balance-8.png",
        alt: "Subtítulo rango 1 ene a fin de periodo",
        pins: [
          {
            x: 58.3, y: 16.0, t: "Rango 1 ene > periodo",
            d: "Subtítulo y API desde/hasta: activo/pasivo desde apertura; resultado desde enero hasta el periodo del encabezado. Solo consulta; no se exportó Excel."
          }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "6. Estado de resultados: solo el mes",
        img: "despues-estado-resultados.png",
        alt: "ER del periodo sin acumulado",
        pins: [
          {
            x: 25.2, y: 10.8, t: "ER del periodo",
            d: "Sin toggle de acumulado: el resultado operativo se lee solo del mes seleccionado. El acumulado queda en Situación financiera. No se cambió periodo."
          }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "7. Situación financiera: resultado del ejercicio",
        img: "despues-situacion-financiera.png",
        alt: "ESF con resultado del ejercicio",
        pins: [
          {
            x: 35.2, y: 61.1, t: "Resultado del ejercicio",
            d: "Línea de patrimonio con el acumulado del ejercicio. Complementa el ER mensual. Solo lectura; no se exportó."
          }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "8. Cierre bodega: consumo packing",
        img: "despues-cierre-bodega.png",
        alt: "Bloque consumo packing en cierre",
        pins: [
          {
            x: 42.5, y: 29.3, t: "Consumo Packing",
            d: "KPI y bloque desde movimientos CONSUMO_PACKING del mes (demo 2026-08). No se cerró el mes ni se guardó parametrización de cuentas."
          }
        ]
      },
      {
        mod: "Compras", cls: "compras",
        title: "9. Notas de cobro: embarcador / Asoex",
        img: "despues-notas-cobro.png",
        alt: "Nota de embarcador en listado",
        pins: [
          {
            x: 28.4, y: 59.8, t: "Nota de embarcador",
            d: "Tipos embarcador / Asoex / gasto directo en fixtures demo. Sin Excel masiva; calce 1 a 1. No se emitió ni anuló nota."
          }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
