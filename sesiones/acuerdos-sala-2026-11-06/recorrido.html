<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Recorrido acuerdos de sala 06/11</title>
  <style>
    :root { --bg: #f4f1ea; --ink: #1c1917; --muted: #57534e; --line: #e7e5e4; --card: #fff; --compras: #9a3412; --ventas: #166534; --conta: #1d4ed8; --teso: #b45309; --param: #0f766e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.35 "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px 0; max-width: 1280px; margin: 0 auto; }
    h1 { font-size: 1.05rem; margin: 0; }
    .layout { display: grid; grid-template-columns: 230px 1fr; gap: 10px; max-width: 1280px; margin: 0 auto; padding: 6px 16px 10px; align-items: start; }
    nav { position: sticky; top: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    nav button.step { display: grid; grid-template-columns: 28px 1fr; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 8px; padding: 4px 6px; cursor: pointer; color: inherit; font: inherit; }
    nav button.step.on { background: #f5f5f4; }
    .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
    .mod { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .ttl { font-weight: 650; }
    .compras { background: var(--compras); }
    .ventas { background: var(--ventas); }
    .conta { background: var(--conta); }
    .teso { background: var(--teso); }
    .param { background: var(--param); }
    main { min-width: 0; }
    .bar { display: flex; align-items: center; gap: 12px; margin: 0; }
    .bar h2 { margin: 0; font-size: 1rem; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .actions button, .actions a.menu { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; color: inherit; text-decoration: none; }
    .actions button:disabled { opacity: .4; cursor: default; }
    .actions a.menu { background: #1c1917; color: #fafaf9; border-color: #1c1917; }
    .frame { position: relative; display: inline-block; max-width: 100%; }
    .frame img { display: block; width: auto; max-width: 100%; max-height: calc(100vh - 168px); height: auto; border-radius: 10px; border: 1px solid var(--line); }
    button.pin { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; padding: 0; border-radius: 50%; border: 2px solid #fff; color: #fff; font-weight: 700; font-size: 13px; box-shadow: 0 1px 3px rgba(0,0,0,.4); z-index: 1; opacity: .45; cursor: pointer; }
    button.pin.on { width: 36px; height: 36px; margin: -18px 0 0 -18px; font-size: 16px; opacity: .85; outline: 3px solid #facc15; z-index: 2; }
    .card { margin-top: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
    .card h3 { margin: 0 0 2px; font-size: 0.95rem; }
    .card p { margin: 0; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } nav { position: static; } }
  </style>
</head>
<body>
  <header>
    <h1>De dónde sale el dato.</h1>
    <div class="bar">
      <h2 id="title"></h2>
      <div class="actions">
        <a class="menu" href="comparacion.html">Comparación</a>
        <button type="button" id="prev">Anterior</button>
        <button type="button" id="next">Siguiente</button>
      </div>
    </div>
  </header>
  <div class="layout">
    <nav id="rail"></nav>
    <main>
      <div id="stage"></div>
      <div class="card" id="card"></div>
    </main>
  </div>
  <script>
    const steps = [
      {
        mod: "Admin", cls: "param",
        title: "1. Cargo y topes del eslabón",
        img: "despues-reglas-eslabon.png",
        alt: "Editar nodo de escala, sin guardar",
        pins: [
          { x: 58.3, y: 57.0, t: "Visación Paralelo (OR)", d: "Con 2 integrantes en Gerencia General: Paralelo (OR) - basta la firma de cualquiera. Alternativa Unánime (AND) para faenas que exigen ambas firmas. No se apretó Guardar." },
          { x: 27.5, y: 69.9, t: "Topes de aprobación", d: "Rango 1 (GG) trae tope obligatorio preconfigurado $30.000.000 CLP / 3.000 FX, editable. Evita tipazos. La visación exige PIN de 4 dígitos. No se apretó Guardar." },
          { x: 50.0, y: 75.0, t: "Hasta CLP", d: "Tabla de topes por moneda con Desde/Hasta y equivalencia CLP al TC del día. Captura solo lectura." }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "2. Guías por confirmar y fotos de respaldo",
        img: "despues-guias-por-confirmar.png",
        alt: "Libro de guías en la pestaña Por confirmar, con acciones de confirmación y fotos",
        pins: [
          { x: 57.3, y: 20.8, t: "Por confirmar", d: "La pestaña lista las guías físicas que aún no suman stock. El aviso arriba indica que adjuntar foto o documento es opcional (respaldo)." },
          { x: 88.1, y: 61.1, t: "Sin adjunto", d: "Se puede confirmar con 'Sin adjunto'. El stock sube al confirmar la recepción física; la foto no es obligatoria. No se confirmó ni se subió archivo." },
          { x: 94.2, y: 55.0, t: "Confirmar", d: "Acción de confirmación física. No se apretó Confirmar en esta captura." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "3. Comentario del comprobante",
        img: "despues-asiento-detalle.png",
        alt: "Detalle AJU-2026-001 con el comentario vacío",
        pins: [
          { x: 49.5, y: 34.1, t: "Comentario", d: "El texto se guarda en el comprobante y no reescribe la glosa. La glosa de arriba sigue siendo la del ajuste. No se apretó Guardar comentario." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "4. Anular sin otro comprobante",
        img: "despues-asiento-anular.png",
        alt: "Modal Anular comprobante, sin confirmar",
        pins: [
          { x: 50.0, y: 47.7, t: "Anular comprobante", d: "El aviso sale de la anulación: el comprobante queda Anulado, sale del mayor y no se crea otro. Si quien anula no es jefatura de contabilidad, solo queda una solicitud. No se apretó Sí, anular." }
        ]
      },
      {
        mod: "Contabilidad", cls: "conta",
        title: "5. Acciones del presupuesto",
        img: "despues-presupuestos.png",
        alt: "Presupuestos por departamento, sin abrir el PDF de la fila",
        pins: [
          { x: 94.7, y: 61.6, t: "PDF, editar y eliminar", d: "Los tres iconos son de esa fila: el PDF de la ejecución, editar los datos y eliminar. Exportar Excel y Exportar PDF de arriba ya estaban. No se abrió ni se editó ni se eliminó el presupuesto de Campo." }
        ]
      },
      {
        mod: "Activo fijo", cls: "param",
        title: "6. Alta con OC recepcionada",
        img: "despues-activo-fijo-alta.png",
        alt: "Modal Nuevo activo fijo, sin guardar",
        pins: [
          { x: 25.5, y: 14.2, t: "OC recepcionada", d: "La lista solo trae órdenes de tipo activo fijo que ya están recepcionadas. Sin esa orden no se puede dar de alta. No se eligió una OC ni se apretó Guardar activo." },
          { x: 50.0, y: 14.2, t: "Factura opcional", d: "La factura de compras se puede dejar vacía: el campo no lleva asterisco. El activo puede nacer de la OC recepcionada aunque la factura todavía no esté en el libro." }
        ]
      },
      {
        mod: "Tesorería", cls: "teso",
        title: "7. Cartola en pesos",
        img: "despues-cartola.png",
        alt: "Detalle de cartola Banco Estado, sin cambiar la vista",
        pins: [
          { x: 41.1, y: 49.2, t: "Ver en pesos", d: "El botón convierte la vista de esta cartola a pesos con el tipo de cambio que se informe. No inventa un tipo si falta. Al lado está el PDF. No se apretó Ver en pesos ni PDF. Los movimientos seguían cargando." }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "8. Recetas con Centro de Costo",
        img: "despues-recetas-lista.png",
        alt: "Listado de recetas de embalaje con columna Centro de Costo",
        pins: [
          { x: 33.9, y: 37.7, t: "Recetas embalaje", d: "Pestaña de recetas asociadas al embalaje (todos los packing), no a un packing único. Columna Centro de Costo y costo materiales / caja al promedio de bodega. No se creó ni editó." },
          { x: 94.0, y: 11.3, t: "+ Nueva receta", d: "Alta con especie/formato, centro de costo opcional y componentes. No se pulsó Guardar." }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "9. Detalle de receta (solo lectura + editar)",
        img: "despues-receta-detalle.png",
        alt: "Modal detalle de receta REC-CER-5K",
        pins: [
          { x: 47.3, y: 64.3, t: "Costo materiales / caja", d: "Total $506 valorizado con costo unitario de bodega al momento de mostrar. El consumo real queda fijado al promedio del mes (#38)." },
          { x: 53.3, y: 55.0, t: "Ámbito embalaje", d: "Embalaje (todos los packing): la receta no queda atada a un solo packing. El consumo se reparte por packing al declarar." },
          { x: 40.8, y: 71.4, t: "Editar datos", d: "Desde el detalle se puede editar o desactivar. Click de fila abre detalle; lápiz edita. No se guardó." }
        ]
      },
      {
        mod: "Insumos", cls: "compras",
        title: "10. Consumo por packing (detalle solo lectura)",
        img: "despues-consumo-detalle.png",
        alt: "Modal consumo PP-202608-0001 con promedio bodega",
        pins: [
          { x: 50.0, y: 45.6, t: "Consumo por packing", d: "Desglose de cajas por packing en el lote. Solo lectura: el consumo ya rebajó stock." },
          { x: 66.1, y: 56.9, t: "Materiales (promedio bodega)", d: "Valorización al precio promedio ponderado del stock del mes, sin FIFO por guía (#38)." },
          { x: 79.4, y: 56.9, t: "Costo total", d: "Total del lote fijado al declarar. Un mes ya consumido no se reescribe si el promedio cambia después." }
        ]
      },
      {
        mod: "Admin", cls: "param",
        title: "11. Esquema de Ramas & Rango de Autoridad (1 al 4)",
        img: "despues-esquema-ramas-aprobacion.png",
        alt: "Esquema de Ramas con Gerencia General en Rango 1, cargos en paralelo y simulador en vivo",
        pins: [
          { x: 88.1, y: 28.6, t: "Gerencia General (Rango 1)", d: "Vértice Nivel 1 con tope supremo $30.000.000 CLP. Sergio y Nicolás Donoso en Paralelo (OR)." },
          { x: 23.2, y: 44.3, t: "+ Nueva Rama", d: "Alta de rama operativa (Agrícola, Packing, Administración, Contratistas). No se creó rama." },
          { x: 33.7, y: 44.3, t: "+ Nuevo Eslabón / Cargo", d: "Alta de cargo con rango 1-4, topes multimoneda y modalidad OR/AND/escala 3.1-3.2. No se guardó." }
        ]
      },
      {
        mod: "Admin", cls: "param",
        title: "12. Usuarios con Cargo y Rango de Autoridad",
        img: "despues-usuarios-cargo-arbol.png",
        alt: "Grilla de usuarios con columna Cargo en Árbol Jerárquico",
        pins: [
          { x: 48.0, y: 35.0, t: "Cargo Jerárquico y Rango", d: "Columna que muestra el cargo, rango de autoridad (1 a 4) y topes de cada usuario en el árbol. Elimina la necesidad de crear grupos artificiales repetitivos." },
          { x: 88.0, y: 8.5, t: "Nuevo Usuario", d: "Al crear o editar un usuario se selecciona su Rama y Cargo, heredando automáticamente su posición en el árbol y su escala de aprobación." }
        ]
      },
      {
        mod: "Admin", cls: "param",
        title: "13. Eslabones Configurables & Rangos de Decisión",
        img: "despues-eslabon-configurar-modal.png",
        alt: "Modal para configurar nombres, modalidades de aprobación y personas de cada eslabón",
        pins: [
          { x: 50.0, y: 25.0, t: "Nombre configurable", d: "Nombre y código del eslabón (ej. Gerencia General / GG-01). No se apretó Guardar." },
          { x: 58.3, y: 57.0, t: "Modalidad OR / AND", d: "Visación multi-integrante: Paralelo (OR) o Unánime (AND). Captura en GG con OR." },
          { x: 27.5, y: 69.9, t: "Topes + PIN 4 dígitos", d: "Tope obligatorio en GG ($30M CLP). La firma de OC exige PIN de 4 dígitos. No se guardó." }
        ]
      },
      {
        mod: "Admin", cls: "param",
        title: "14. Creación Dinámica de Ramas & Nivel de Rama",
        img: "despues-modal-nueva-rama.png",
        alt: "Modal para dar de alta ramas dinámicas con número de nivel jerárquico",
        pins: [
          { x: 45.0, y: 34.0, t: "Nivel de la Rama", d: "Estrato jerárquico de la rama: Nivel 1 = Dirección General (raíz), Nivel 2 = Ramas Operativas (Agrícola, Packing, Administración, Contratistas, desplegadas juntas en paralelo), Nivel 3+ = Sub-ramas subordinadas situadas abajo del Nivel 2." },
          { x: 50.0, y: 44.0, t: "Identificación de la Rama", d: "Código, nombre y subtítulo totalmente personalizables (ej. Rama Contratistas, Rama Packing, Rama Bodega)." },
          { x: 50.0, y: 60.0, t: "Módulos Aplicables", d: "Asigna qué módulos del ERP (Compras, Contratistas, Insumos, etc.) operan bajo las cadenas de esta rama." }
        ]
      }
    ];

    let step = 0, pin = 0;
    const rail = document.getElementById("rail");
    const stage = document.getElementById("stage");
    const card = document.getElementById("card");
    const title = document.getElementById("title");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    steps.forEach((s, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "step";
      b.innerHTML = `<span class="n ${s.cls}">${i + 1}</span><span><span class="mod">${s.mod}</span><br><span class="ttl">${s.title.replace(/^\d+\.\s/, "")}</span></span>`;
      b.addEventListener("click", () => show(i, 0));
      rail.appendChild(b);
    });

    function show(i, p) {
      step = i; pin = p;
      const s = steps[i];
      title.textContent = s.title;
      prev.disabled = i === 0 && p === 0;
      next.disabled = i === steps.length - 1 && p === s.pins.length - 1;
      [...rail.children].forEach((el, idx) => el.classList.toggle("on", idx === i));
      stage.innerHTML = "";
      const frame = document.createElement("div");
      frame.className = "frame";
      const img = document.createElement("img");
      img.src = s.img;
      img.alt = s.alt;
      frame.appendChild(img);
      s.pins.forEach((item, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "pin " + s.cls + (idx === p ? " on" : "");
        b.style.left = item.x + "%";
        b.style.top = item.y + "%";
        b.textContent = String(idx + 1);
        b.title = item.t;
        b.addEventListener("click", () => show(i, idx));
        frame.appendChild(b);
      });
      stage.appendChild(frame);
      const item = s.pins[p];
      card.innerHTML = `<h3>${item.t}</h3><p>${item.d}</p>`;
    }
    function forward() {
      const s = steps[step];
      if (pin < s.pins.length - 1) show(step, pin + 1);
      else if (step < steps.length - 1) show(step + 1, 0);
    }
    function back() {
      if (pin > 0) show(step, pin - 1);
      else if (step > 0) show(step - 1, steps[step - 1].pins.length - 1);
    }
    prev.addEventListener("click", back);
    next.addEventListener("click", forward);
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowRight") forward();
      if (ev.key === "ArrowLeft") back();
    });
    show(0, 0);
  </script>
</body>
</html>
